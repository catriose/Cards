<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layout</title>
    <style>
              body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
            max-width: 100%;
            overflow-x: auto;
        }

        .card {
            flex: 0 0 auto;
            width: 250px;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .card h3 {
            margin: 0;
            font-size: 1.2em;
            color: #333;
        }

        .card p {
            margin: 10px 0 0;
            font-size: 0.9em;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="https://images.pexels.com/photos/2253275/pexels-photo-2253275.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Cute dog">
            <h3>Cute dog nr. 1</h3>
            <p>This is Masy, she likes long walks on the beach and head scratches.</p>
        </div>
        <div class="card">
            <img src="https://images.pexels.com/photos/160846/french-bulldog-summer-smile-joy-160846.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Cute dog">
            <h3>Cute dog nr. 2</h3>
            <p>This is Arthur, he likes to eat anything that drops on the floor.</p>
        </div>
        <div class="card">
            <img src="https://images.pexels.com/photos/20028651/pexels-photo-20028651/free-photo-of-photo-of-a-chihuahua-puppy-against-white-background.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Cute dog">
            <h3>Cute dog nr. 3</h3>
            <p>This is Oatly, she is the smallest puppy ever. Ever. </p>
        </div>
    </div>
</body>
</html>
